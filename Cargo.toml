[package]
name = "mp3_converter"
version = "0.3.0"
edition = "2024"
description = "Convert video and audio files to MP3, M4A, WAV or FLAC, offline."
repository = "https://github.com/fredle/mp3-converter"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
velopack = "1.2"
# Already in the build through velopack; used to send in-app feedback.
ureq = "3"
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.31"
